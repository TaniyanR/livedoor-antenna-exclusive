<!DOCTYPE html>
<html lang="ja" itemscope itemtype="http://schema.org/Blog">
<head>
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<$HeadSectionCommon$>
<meta name="description" content="<$BlogDescription ESCAPE$>" />
<$OGP$>
<link rel="alternate" media="handheld" type="application/xhtml+xml" href="<$BlogMobileUrl$>" />
<title><$ArticleTitle ESCAPE$> - <$BlogTitle ESCAPE$></title>
<script src="<$PartsBaseUrl$>/js/usr/import.js"></script>
</head>

<body class="default_2012 page-article splash-article">

<$BlogHeader$>

<div id="wrapper">

<header id="blog-header">
  <div id="blog-header-inner">
    <h1 id="blog-title">
      <a href="<$BlogUrl$>"><$BlogTitle ESCAPE$></a>
    </h1>
  </div>
</header>

<main id="content">

  <article class="article">

    <header class="article-header">
      <h1 class="article-title"><$ArticleTitle ESCAPE$></h1>
    </header>

    <div class="article-body">
      <div class="article-body-inner">
        <$ArticleBody$>
        <$ArticleBodyMore$>
      </div>
    </div>

  </article>

  <nav class="splash-article-pager">
    <SetVar ArticlePagerType>2</SetVar>
    <SetVar PrevArticleText>前の記事</SetVar>
    <SetVar NextArticleText>次の記事</SetVar>
    <$ArticlePager$>
  </nav>

</main>

<footer id="blog-footer">
  <div class="splash-footer-inner">
    <a href="https://splashr.blog.jp/archives/14114691.html">スプラッシュについて</a>
    <a href="https://splashr.blog.jp/archives/14114703.html">Privacy Policy</a>
    <a href="https://message.blogcms.jp/livedoor/toolhouse-hbs1jlre/message">お問い合わせ</a>
  </div>
</footer>

</div>

</body>
</html>
